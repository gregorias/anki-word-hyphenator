[project]
name = "anki-word-hyphenator"
version = "0.1.0"
description = "Anki add-on for word hyphenation."
authors = [{ name = "Grzegorz Milka", email = "grzegorzmilka@gmail.com" }]
# Use 3.13, because that’s what Anki uses
# (https://github.com/ankitects/anki/releases/tag/25.07).
requires-python = ">=3.13.5, <3.14"
readme = "README.md"
license = "AGPLv3"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
]
dependencies = [
  # https://pypi.org/project/anki/
  "anki==26.5",
  # https://pypi.org/project/aqt/
  "aqt==26.5",
  # Use the same version of PyQt6 as Anki:
  # https://github.com/ankitects/anki/blob/cfe007770a862dfd806488903a712007f3b3bf04/qt/pyproject.toml#L35-L41
  "pyqt6==6.11.0",
  "pyqt6-qt6==6.11.0",
  "PyQt6-WebEngine==6.11.0",
  "PyQt6-WebEngine-qt6==6.11.0",
]

[project.urls]
Repository = "https://github.com/gregorias/anki-word-hyphenator"

[dependency-groups]
dev = ["mypy>=1.16", "vulture~=2.14", "coverage", "types-beautifulsoup4"]

[tool.uv]
# We use Python only for the dependency management, not for packaging.
# This is because Anki plugins are distributed as zipped directories, not as wheels.
package = false

[tool.vulture]
ignore_names = []
